<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file:; style-src 'self' file:; script-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Gym Organizer</title>
  <link rel="stylesheet" href="theme.css">
  <script src="themes.js"></script>
  <script defer src="icons.js"></script>
  <script defer src="body-map-data.js"></script>
  <script defer src="muscle-map.js"></script>
  <script defer src="training-log.js"></script>
  <script defer src="profile.js"></script>
  <script defer src="programs.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="shell">
    <main id="screen"></main>
    <nav id="navigation" aria-label="Navegação principal"></nav>
  </div>
  <dialog id="sheet"></dialog>
  <dialog id="scale-sheet" aria-labelledby="scale-title"></dialog>
  <dialog id="photo-viewer" aria-labelledby="photo-title"></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
